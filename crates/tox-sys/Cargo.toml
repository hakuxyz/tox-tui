[package]
name = "tox-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tox-sys"
description = "Raw FFI bindings to c-toxcore"
readme = "README.md"
keywords = ["tox", "p2p", "ffi", "bindings"]
