[package]
name = "tox-tui"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/tox-tui"
description = "Terminal UI for the Tox P2P messenger"
readme = "../../README.md"
keywords = ["tox", "p2p", "tui", "messenger", "terminal"]
categories = ["command-line-utilities"]
default-run = "tox-tui"

[[bin]]
name = "tox-tui"
path = "src/main.rs"

[dependencies]
tox-client = { path = "../tox-client", version = "0.1.0" }
tox-sys = { path = "../tox-sys", version = "0.1.1" }
tokio = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
anyhow = { workspace = true }
futures = "0.3"
hex = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
toml = "0.8"
serde = { workspace = true }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
