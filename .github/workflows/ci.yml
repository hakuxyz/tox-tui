name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install c-toxcore deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev libcurl4-openssl-dev libevent-dev

      - name: Cache c-toxcore
        id: cache-tox
        uses: actions/cache@v4
        with:
          path: local
          key: toxcore-${{ runner.os }}-${{ hashFiles('crates/tox-sys/**') }}

      - name: Build c-toxcore
        if: steps.cache-tox.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules --branch v0.2.24 https://github.com/TokTok/c-toxcore.git /tmp/c-toxcore
          cmake -S /tmp/c-toxcore -B /tmp/c-toxcore/build \
            -DCMAKE_INSTALL_PREFIX=$PWD/local \
            -DBUILD_TOXAV=OFF \
            -DBUILD_SHARED_LIBS=ON
          cmake --build /tmp/c-toxcore/build -j"$(nproc)"
          cmake --install /tmp/c-toxcore/build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        env:
          TOXCORE_PREFIX: ${{ github.workspace }}/local
          LD_LIBRARY_PATH: ${{ github.workspace }}/local/lib
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        env:
          TOXCORE_PREFIX: ${{ github.workspace }}/local
          LD_LIBRARY_PATH: ${{ github.workspace }}/local/lib
        run: cargo test --workspace
